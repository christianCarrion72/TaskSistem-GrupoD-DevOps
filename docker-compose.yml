services:
  db:
    image: postgres:16-alpine
    container_name: tasksis-db
    environment:
      POSTGRES_DB: tasksis
      POSTGRES_USER: tasksis
      POSTGRES_PASSWORD: tasksis123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksis -d tasksis"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: ${BACKEND_IMAGE:-ghcr.io/christiancarrion72/tasksis-api:latest}
    container_name: tasksis-api
    ports:
      - "5255:5255"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tasksis;Username=tasksis;Password=tasksis123
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/christiancarrion72/tasksis-frontend:latest}
    container_name: tasksis-frontend
    ports:
      - "80:80"
    depends_on:
      - api

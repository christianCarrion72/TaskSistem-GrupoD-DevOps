services:
  db:
    image: postgres:16-alpine
    container_name: tasksis-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tasksis}
      POSTGRES_USER: ${DB_USERNAME:-tasksis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasksis123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tasksis} -d ${DB_DATABASE:-tasksis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./TaskSis.Api
      dockerfile: Dockerfile
    container_name: tasksis-api
    ports:
      - "5255:5255"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-tasksis}
      - DB_USERNAME=${DB_USERNAME:-tasksis}
      - DB_PASSWORD=${DB_PASSWORD:-tasksis123}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./tasksis-frontend
      dockerfile: Dockerfile
    container_name: tasksis-frontend
    ports:
      - "80:80"
    depends_on:
      - api
